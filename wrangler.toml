name = "student-assessment-portal"
main = "src/worker.mjs"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
run_worker_first = ["/api"]

[[d1_databases]]
binding = "DB"
database_name = "portal-db"
database_id = "PUT-YOUR-DATABASE-ID-HERE"   # printed by: npx wrangler d1 create portal-db
migrations_dir = "migrations"
